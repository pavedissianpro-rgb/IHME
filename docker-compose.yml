services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: badminton
      POSTGRES_USER: badminton
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U badminton -d badminton"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_PATH: ${BASE_PATH:-/ihme/}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      BASE_PATH: ${BASE_PATH:-/ihme/}
      DATABASE_URL: ${DATABASE_URL:?Configurez DATABASE_URL dans .env}
      COACH_PASSWORD: ${COACH_PASSWORD:-}
      CLUB_TIMEZONE: ${CLUB_TIMEZONE:-Europe/Paris}
      CLUB_LOCATION: ${CLUB_LOCATION:-Gymnase Pillon}
      CLUB_TUESDAY_COACH: ${CLUB_TUESDAY_COACH:-}
      CLUB_THURSDAY_COACH: ${CLUB_THURSDAY_COACH:-}
      CLUB_FRIDAY_COACH: ${CLUB_FRIDAY_COACH:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
