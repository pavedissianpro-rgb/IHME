services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: badminton
      POSTGRES_USER: badminton
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U badminton -d badminton"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost}
      ALLOW_REAL_NAMES: ${ALLOW_REAL_NAMES:-false}
      CLUB_TIMEZONE: ${CLUB_TIMEZONE:-Europe/Paris}
      CLUB_LOCATION: ${CLUB_LOCATION:-Pillon}
      CLUB_TUESDAY_COACH: ${CLUB_TUESDAY_COACH:-}
      CLUB_THURSDAY_COACH: ${CLUB_THURSDAY_COACH:-}
      CLUB_FRIDAY_COACH: ${CLUB_FRIDAY_COACH:-}
      PGHOST: database
      PGPORT: 5432
      PGDATABASE: badminton
      PGUSER: badminton
      PGPASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Définissez JWT_SECRET dans .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Définissez ADMIN_EMAIL dans .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Définissez ADMIN_PASSWORD dans .env}
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
